name: feed

# Rebuilds the static catalogs and publishes them with GitHub Pages.
# Nothing is committed: the site is replaced wholesale from the build artifact.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (Actions may delay a few min)
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one still runs after the current ends.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: .cache
          key: upstream-${{ github.run_id }}
          restore-keys: upstream-

      - name: Build feed
        run: python3 build.py --out out --cache-dir .cache

      - name: Publish directory layout
        run: ls -l out

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
